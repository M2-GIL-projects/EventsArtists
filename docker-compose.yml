version: '3.9'
services:
 frontend:
   build: .
   ports:
     - "4200:4200"
   depends_on:
     - backend
   networks:
     - app-network

 backend:
   image: eclipse-temurin:17-jre-jammy
   container_name: backend
   volumes:
     - ./event-0.0.1-SNAPSHOT.jar:/app/app.jar
   working_dir: /app
   command: ["java", "-jar", "app.jar"]
   ports:
     - "8081:8080"
   networks:
     - app-network

networks:
 app-network:
   driver: bridge